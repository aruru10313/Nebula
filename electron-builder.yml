appId: 'com.nebula.launcher'
productName: 'Nebula Launcher'
artifactName: 'Nebula-setup-${version}.${ext}'

copyright: 'Nebula Launcher © 2026 Aruru. Based on HeliosLauncher by Daniel D. Scalzi.'

asar: true
compression: 'maximum'

files:
  - '!{dist,.gitignore,.vscode,docs,dev-app-update.yml,.nvmrc,eslint.config.mjs}'

extraResources:
  - 'libraries'

# Windows Configuration
win: 
  icon: 'app/assets/images/nebula-icon.ico'
  target: 
    - target: 'nsis'
      arch: 'x64'

# Windows Installer Configuration
nsis:
  installerIcon: 'app/assets/images/nebula-icon.ico'
  uninstallerIcon: 'app/assets/images/nebula-icon.ico'
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true

# macOS Configuration
mac:
  target:
    - target: 'dmg'
      arch:
        - 'x64'
        - 'arm64'
  artifactName: '${productName}-setup-${version}-${arch}.${ext}'
  category: 'public.app-category.games'
  hardenedRuntime: true
  gatekeeperAssess: false

# Linux Configuration
linux: 
  target:
    - target: 'AppImage'
      arch:
        - 'x64'
    - target: 'deb'
      arch:
        - 'x64'
  maintainer: 'Nebula'
  vendor: 'Nebula'
  synopsis: 'Star-themed modded Minecraft launcher'
  description: 'A custom launcher which manages Minecraft instances, Java, mods, and updates automatically.'
  category: 'Game'


directories:
  buildResources: 'build'
  output: 'dist'

publish:
  provider: 'github'
  owner: 'aruru10313'
  repo: 'Nebula'
  releaseType: 'release'